---

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      - mqtt
    volumes:
      - ..:/opt/pydoor
      - ../shadow.example:/etc/pydoor/shadow:ro
    env_file:
      - .env

  web:
    image: nginx:1.23-alpine
    depends_on:
      - app
    ports:
      - 127.0.0.1:8080:80
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../static:/usr/share/nginx/html:ro

  mqtt:
    image: eclipse-mosquitto:2.0
